name: Publish verified RC4 workbook metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-rc4-metadata.yml']

permissions: {}

jobs:
  publish:
    if: github.repository == 'iffti283/maritime-component-audit' && github.actor == 'iffti283' && github.event.before == '89f5f6de3c3a605f59c007656ec5a9e48cf3a414'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - name: Prepare and verify the archive
        run: |
          url=https://github.com/iffti283/maritime-component-audit/releases/download/v0.1.0-rc4
          curl --retry 2 -fsSL "$url/MCA_Software.zip" -o original.zip
          curl --retry 2 -fsSL "$url/MCA_Companion_1.zip" -o companion.zip
          python3 - original.zip companion.zip MCA_Software_prepared.zip <<'PYTHON'
          import hashlib
          from pathlib import Path
          import sys
          from zipfile import ZipFile

          original, companion, output = map(Path, sys.argv[1:])
          expected = {
              original: "64c17918db068359170b6fe675f61f09e1ef81a2560590f22c03710ac37e8c3e",
              companion: "ea64c014659ce32578520ad0baa190531dd5626d5d675b09c3335a41c2f84e8e",
          }
          def digest(data):
              return hashlib.sha256(data).hexdigest()
          for path, checksum in expected.items():
              if digest(path.read_bytes()) != checksum:
                  raise ValueError(f"Unexpected source archive: {path}")
          workbook = "software/examples/Freeboard_Audit.xlsx"
          with ZipFile(companion) as verified, ZipFile(original) as source, ZipFile(output, "x") as target:
              clean = verified.read(workbook)
              old = source.read(workbook)
              before = f"{digest(old)}  {workbook}\n".encode()
              after = f"{digest(clean)}  {workbook}\n".encode()
              manifest = source.read("SHA256SUMS.txt")
              if manifest.count(before) != 1:
                  raise ValueError("Expected one matching workbook checksum")
              target.comment = source.comment
              for item in source.infolist():
                  if item.filename == workbook:
                      data = clean
                  elif item.filename == "SHA256SUMS.txt":
                      data = manifest.replace(before, after)
                  else:
                      data = source.read(item)
                  target.writestr(item, data)
          print(digest(output.read_bytes()), output.name)
          PYTHON
          echo '902823fb818ec173524e59b748a7636df2cc8de61f9afbbf2583edacbca6a2dc  MCA_Software_prepared.zip' | sha256sum -c
      - name: Publish and download-check the verified software archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          from urllib.request import Request,urlopen
          base='repos/iffti283/maritime-component-audit'
          assets=f'{base}/releases/450504399/assets'
          old_id=764857954
          other_id=765297464
          original_name='MCA_Software.zip'
          stage_name='MCA_Software_prepared.zip'
          old_name='MCA_Software_staged_previous.zip'
          new_hash='902823fb818ec173524e59b748a7636df2cc8de61f9afbbf2583edacbca6a2dc'
          other_hash='ea64c014659ce32578520ad0baa190531dd5626d5d675b09c3335a41c2f84e8e'
          old_hash='64c17918db068359170b6fe675f61f09e1ef81a2560590f22c03710ac37e8c3e'
          def api(resource,method='GET',*args):
              r=subprocess.run(['gh','api','--method',method,resource,*args],text=True,check=True,capture_output=True)
              return json.loads(r.stdout) if r.stdout.strip() else None
          def route(i):
              return f'{base}/releases/assets/{i}'
          def rename(i,name):
              return api(route(i),'PATCH','-f',f'name={name}')
          def expect(item,name,checksum):
              if item['name']!=name or item['digest']!='sha256:'+checksum:
                  raise RuntimeError('Unexpected release asset identity or digest')
          items={r['name']:r for r in api(assets)}
          if items[original_name]['id']!=old_id or items['MCA_Companion_1.zip']['id']!=other_id:
              raise RuntimeError('Asset identity changed')
          expect(items[original_name],original_name,old_hash)
          expect(items['MCA_Companion_1.zip'],'MCA_Companion_1.zip',other_hash)
          if stage_name in items or old_name in items:
              raise RuntimeError('A staged item already exists')
          if hashlib.sha256(Path(stage_name).read_bytes()).hexdigest()!=new_hash:
              raise RuntimeError('Prepared asset failed local digest verification')
          subprocess.run(['gh','release','upload','v0.1.0-rc4',stage_name,'--repo','iffti283/maritime-component-audit'],check=True)
          new_item=next(x for x in api(assets) if x['name']==stage_name)
          expect(new_item,stage_name,new_hash)
          new_id=new_item['id']
          rename(old_id,old_name)
          try:
              released=rename(new_id,original_name)
              expect(released,original_name,new_hash)
              request=Request(released['browser_download_url']+'?sha256='+new_hash,headers={'User-Agent':'MCA-release-check'})
              with urlopen(request,timeout=50) as f:
                  data=f.read()
              if hashlib.sha256(data).hexdigest()!=new_hash:
                  raise RuntimeError('Public download failed digest verification')
          except BaseException:
              if api(route(new_id))['name']==original_name:
                  rename(new_id,stage_name)
              rename(old_id,original_name)
              raise
          expect(api(route(old_id)),old_name,old_hash)
          api(route(old_id),'DELETE')
          expect(api(route(new_id)),original_name,new_hash)
          expect(api(route(other_id)),'MCA_Companion_1.zip',other_hash)
          print('Verified the published software and companion archives.')
          PYTHON
